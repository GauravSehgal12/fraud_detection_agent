name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fraud-detection-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d \
            --name fraud-detection-agent-ci \
            -p 8000:8000 \
            -e CI_SMOKE_TEST=true \
            fraud-detection-agent:ci

      - name: Wait for application startup
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/ > /tmp/health_response.json; then
              echo "Application is ready"
              cat /tmp/health_response.json
              exit 0
            fi
            echo "Waiting for application startup ($i/30)..."
            sleep 2
          done

          echo "Application failed to start"
          docker logs fraud-detection-agent-ci
          exit 1

      - name: Verify Swagger endpoint
        run: curl -fsS http://localhost:8000/docs > /dev/null

      - name: Verify dashboard endpoint
        run: curl -fsS http://localhost:8000/dashboard/ > /dev/null

      - name: Show container logs
        if: always()
        run: docker logs fraud-detection-agent-ci

      - name: Stop and remove container
        if: always()
        run: docker rm -f fraud-detection-agent-ci || true

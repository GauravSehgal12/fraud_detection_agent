name: Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  docker-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "push_tags=$IMAGE:v1,$IMAGE:latest" >> "$GITHUB_OUTPUT"
          else
            echo "push_tags=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fraud-detection-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d \
            --name fraud-detection-agent-ci \
            -p 8000:8000 \
            -e CI_SMOKE_TEST=true \
            fraud-detection-agent:ci

      - name: Wait for application startup
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/ > /tmp/health_response.json; then
              echo "Application is ready"
              cat /tmp/health_response.json
              exit 0
            fi
            echo "Waiting for application startup ($i/30)..."
            sleep 2
          done

          echo "Application failed to start"
          docker logs fraud-detection-agent-ci
          exit 1

      - name: Verify Swagger endpoint
        run: curl -fsS http://localhost:8000/docs > /dev/null

      - name: Verify dashboard endpoint
        run: curl -fsS http://localhost:8000/dashboard/ > /dev/null

      - name: Show container logs
        if: always()
        run: docker logs fraud-detection-agent-ci

      - name: Stop and remove container
        if: always()
        run: docker rm -f fraud-detection-agent-ci || true

      - name: Push validated image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag fraud-detection-agent:ci "$IMAGE:v1"
          docker tag fraud-detection-agent:ci "$IMAGE:latest"
          docker push "$IMAGE:v1"
          docker push "$IMAGE:latest"
